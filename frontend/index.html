<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessment Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col font-sans">

  <!-- Navigation Bar -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-xl font-bold tracking-tight">QuizPortal</span>
        <span class="text-xs bg-indigo-800 px-2 py-0.5 rounded-full uppercase tracking-wider font-semibold">Client Tier</span>
      </div>
      <div id="authNav" class="flex items-center space-x-4">
        <!-- Injected via JavaScript -->
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow max-w-6xl mx-auto w-full p-4 sm:p-6 space-y-6">

    <!-- Global Alert Box -->
    <div id="alertBox" class="hidden p-4 rounded-lg text-sm font-medium"></div>

    <!-- VIEW 1: AUTHENTICATION (Login / Register) -->
    <section id="viewAuth" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex border-b border-slate-200 mb-6">
        <button id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 pb-3 text-center font-semibold border-b-2 border-indigo-600 text-indigo-600">Login</button>
        <button id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 pb-3 text-center font-medium text-slate-500">Register</button>
      </div>

      <!-- Login Form -->
      <form id="formLogin" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Email</label>
          <input type="email" id="loginEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="formRegister" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Full Name</label>
          <input type="text" id="regName" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Email</label>
          <input type="email" id="regEmail" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Password</label>
          <input type="password" id="regPassword" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Role</label>
          <select id="regRole" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white">
            <option value="student">Student</option>
            <option value="instructor">Instructor</option>
          </select>
        </div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">Create Account</button>
      </form>
    </section>

    <!-- VIEW 2: DASHBOARD (Catalog, Metrics, & History) -->
    <section id="viewDashboard" class="hidden space-y-8">

      <!-- Metrics Card (For Students) -->
      <div id="metricsPanel" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></div>

      <!-- Action Sub-header -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h2 class="text-2xl font-bold">Quiz Catalog</h2>
          <p class="text-sm text-slate-500">Available assessments for your enrolled subjects</p>
        </div>
        <div class="flex items-center space-x-3">
          <button id="btnOpenCreator" onclick="showQuizCreatorModal()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium text-sm transition">
            + Create New Quiz
          </button>
          <button onclick="loadHistory()" class="bg-white border border-slate-300 hover:bg-slate-50 px-4 py-2 rounded-lg font-medium text-sm transition">
            Past Attempts
          </button>
        </div>
      </div>

      <!-- Quiz Catalog Cards -->
      <div id="quizList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <!-- Attempt History Section -->
      <div id="historySection" class="hidden bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="text-lg font-bold">My Completed Attempts</h3>
          <button onclick="document.getElementById('historySection').classList.add('hidden')" class="text-slate-400 hover:text-slate-600">✕ Close</button>
        </div>
        <div id="historyList" class="divide-y divide-slate-100"></div>
      </div>
    </section>

    <!-- VIEW 3: ACTIVE TEST TAKING RUNNER -->
    <section id="viewTestRunner" class="hidden max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-200 space-y-6">
      <div class="flex justify-between items-center border-b pb-4">
        <div>
          <h2 id="runnerQuizTitle" class="text-xl font-bold">Quiz</h2>
          <span class="text-xs text-slate-500">Server-enforced timer active</span>
        </div>
        <div class="flex items-center space-x-2 bg-amber-50 border border-amber-200 text-amber-800 px-3 py-1.5 rounded-lg">
          <span class="text-xs uppercase tracking-wider font-bold">Time Left:</span>
          <span id="countdownTimer" class="font-mono font-bold text-lg">--:--</span>
        </div>
      </div>

      <!-- Question Items Render Area -->
      <form id="formTestSession" onsubmit="handleAttemptSubmit(event)" class="space-y-6">
        <div id="questionsContainer" class="space-y-6"></div>
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-sm transition">
          Submit Assessment
        </button>
      </form>
    </section>

    <!-- VIEW 4: ASSESSMENT BREAKDOWN & RESULTS -->
    <section id="viewResults" class="hidden max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md border border-slate-200 space-y-6">
      <div class="text-center space-y-2 border-b pb-6">
        <div id="resultStatusBadge" class="inline-block px-4 py-1.5 rounded-full text-sm font-bold uppercase tracking-wider"></div>
        <h2 class="text-3xl font-extrabold" id="resultScore">0%</h2>
        <p class="text-sm text-slate-500" id="resultPointTally">Earned 0 / 0 points</p>
      </div>

      <div class="space-y-4">
        <h3 class="text-lg font-bold">Review & Explanations</h3>
        <div id="resultBreakdown" class="space-y-4"></div>
      </div>

      <button onclick="returnToDashboard()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-lg transition">
        Return to Catalog
      </button>
    </section>

    <!-- MODAL: INSTRUCTOR QUIZ CREATOR -->
    <div id="modalCreator" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
      <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
          <h3 class="text-lg font-bold">Create New Assessment</h3>
          <button onclick="closeQuizCreatorModal()" class="text-slate-400 hover:text-slate-600">✕</button>
        </div>

        <form id="formCreateQuiz" onsubmit="handleCreateQuiz(event)" class="space-y-4">
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-bold uppercase text-slate-500">Title</label>
              <input type="text" id="qTitle" required class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
            <div>
              <label class="text-xs font-bold uppercase text-slate-500">Subject</label>
              <input type="text" id="qSubject" required placeholder="e.g. CS101" class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
          </div>

          <div>
            <label class="text-xs font-bold uppercase text-slate-500">Description</label>
            <textarea id="qDesc" rows="2" class="w-full px-3 py-2 border rounded-lg text-sm"></textarea>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs font-bold uppercase text-slate-500">Time Limit (Minutes)</label>
              <input type="number" id="qTime" min="1" value="15" required class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
            <div>
              <label class="text-xs font-bold uppercase text-slate-500">Passing Score (%)</label>
              <input type="number" id="qPassScore" min="1" max="100" value="60" required class="w-full px-3 py-2 border rounded-lg text-sm">
            </div>
          </div>

          <!-- Dynamic Questions Builder -->
          <div class="border-t pt-4 space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-sm font-bold">Questions</span>
              <button type="button" onclick="addQuestionField()" class="text-xs text-indigo-600 font-semibold hover:underline">+ Add Question</button>
            </div>
            <div id="questionsBuilder" class="space-y-4"></div>
          </div>

          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition">
            Publish Quiz
          </button>
        </form>
      </div>
    </div>

  </main>

  <!-- Scripts: Loaded in dependency order -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/quizzes.js"></script>
  <script src="js/attempts.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
